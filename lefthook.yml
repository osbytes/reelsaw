# Git hooks (https://lefthook.dev), installed by `pnpm install`. Fast checks only; CI (ci.yml,
# security.yml, contributors.yml) is the gate. Skip once with `LEFTHOOK=0 git commit …`.
# Commands go through `scripts/hook.mjs` (Node spawn, not bash) so they run on Windows Git, where
# `{ echo; exit 0; }` and nested quotes fail. The secret and workflow scans need gitleaks and
# zizmor on PATH; without them the hook says so and lets the commit through.

pre-commit:
  commands:
    secrets:
      run: node scripts/hook.mjs optional gitleaks git --pre-commit --staged --redact --no-banner .

commit-msg:
  commands:
    # the DCO sign-off every commit needs (CONTRIBUTING.md), the same trailer `git commit -s` writes
    signoff:
      run: node scripts/hook.mjs signoff {1}

pre-push:
  commands:
    workflows:
      glob: ".github/**/*.{yml,yaml}" # workflows, actions, dependabot.yml
      run: node scripts/hook.mjs optional zizmor --offline --no-progress .
