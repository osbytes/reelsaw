# Dependabot, security first. Version bumps of npm packages are off: the app pins what it needs and
# bumps on purpose (pnpm update, a changeset, an eval run). Security updates stay on and arrive as
# one PR per manifest instead of one per advisory. The dependabot-changeset workflow adds the
# changeset CI requires. Actions and base-image digests still get a monthly, grouped bump, because
# SHA pins and digests go stale and carry no behavioural risk. Version bumps wait 7 days after a
# release (cooldown), so a hijacked release is usually pulled before Dependabot proposes it;
# security updates skip the cooldown.
version: 2
updates:
  # the pnpm workspace (apps/server, apps/web, packages/shared share the root lockfile):
  # open-pull-requests-limit: 0 switches version updates off while keeping this entry's
  # settings in force for security updates
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # OpenTelemetry ships SDK majors and the 0.x experimental packages as one coordinated set
      # (3.0 pairs with 0.300 and removes sdk-trace-node); the set moves in one deliberate PR
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]

  # reelsaw.com, own lockfile outside the workspace: same policy
  - package-ecosystem: npm
    directory: /website
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # actions are pinned by commit SHA with a version comment; one grouped PR a month keeps them current
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # a new major of an action renames inputs (changesets/action v2 did); bump by hand
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # base image digests in the Dockerfile; never the major (Node and Alpine lines are chosen by hand).
  # The compose files pull by tag on purpose so operators get Postgres and Speaches patches directly.
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
