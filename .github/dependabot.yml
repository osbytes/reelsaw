# Dependabot: version updates, weekly, grouped so a week's bumps arrive as one PR per ecosystem
# (security updates still come on their own, as soon as an advisory lands). Every PR runs CI; the
# dependabot-changeset workflow adds the patch changeset CI requires when the app is touched.
version: 2
updates:
  # the pnpm workspace: apps/server, apps/web, packages/shared share one lockfile at the root
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      app:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # OpenTelemetry ships SDK majors and the 0.x experimental packages as one coordinated set
      # (3.0 pairs with 0.300 and removes sdk-trace-node). One PR per package cannot work; the
      # whole set moves in one deliberate PR with a telemetry smoke test.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node line the image runs (Dockerfile), not the newest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # reelsaw.com has its own lockfile, outside the workspace
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    groups:
      website:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  # actions are pinned by commit SHA with a version comment; Dependabot keeps both in step
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # base image digests in the Dockerfile (the compose files pull by tag on purpose: operators get
  # Postgres and Speaches patch releases without waiting for a Reelsaw release)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # digests and patch tags only: a new Node or Alpine major is a deliberate change (native
      # modules, onnxruntime-node) and gets its own PR and release note
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
