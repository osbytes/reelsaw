# Release: on a version tag (v1.2.3), build the image for amd64 + arm64, check it carries no
# source, push it to GHCR (always) and Docker Hub (when configured), and attach the install
# folder (deploy/) to the GitHub release.
#
# Configure (Settings → Secrets and variables → Actions):
#   vars.GHCR_IMAGE        optional, default ghcr.io/<owner>/reelsaw
#   vars.DOCKERHUB_IMAGE   optional, e.g. osbytes/reelsaw; Docker Hub is skipped unless this and
#   secrets.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN are set
#   secrets.SENTRY_AUTH_TOKEN, vars.SENTRY_ORG, vars.SENTRY_PROJECT
#                          optional: upload the bundles' source maps to Sentry (they never ship in the image)
#                          and attach the release's commits; skipped unless all three are set
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# read-only by default; the one job takes exactly the write scopes it needs
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      packages: write      # push to GHCR
      id-token: write      # sign the build provenance attestation (Sigstore, via GitHub OIDC)
      attestations: write  # store it on the repository and next to the image
    env:
      # image names must be lowercase (owners can have capitals)
      GHCR_IMAGE_IN: ${{ vars.GHCR_IMAGE || format('ghcr.io/{0}/reelsaw', github.repository_owner) }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        run: |
          GHCR_IMAGE=$(printf %s "$GHCR_IMAGE_IN" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> "$GITHUB_ENV"
          # tag names may only be versions: nothing else ever reaches a shell
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "not a version tag: $GITHUB_REF_NAME"; exit 1; } ;; esac
          echo "version=$(printf %s "${GITHUB_REF_NAME#v}" | tr -cd 'A-Za-z0-9.+-')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_IMAGE" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            printf 'images<<EOF\n%s\n%s\nEOF\n' "$GHCR_IMAGE" "$DOCKERHUB_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            printf 'images<<EOF\n%s\nEOF\n' "$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.v.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # one multi-arch build, pushed under a staging tag; checked; then retagged without rebuilding
      - name: Build (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          # BuildKit attaches an SBOM and SLSA provenance to the image index (docker buildx imagetools inspect ... shows them)
          provenance: mode=max
          sbom: true
          # zstd: multi-threaded and several times faster to compress than gzip, slightly smaller.
          # Pulling needs Docker Engine 23+ / containerd 1.5+.
          outputs: type=image,name=${{ env.GHCR_IMAGE }}:sha-${{ steps.v.outputs.commit }},push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REELSAW_VERSION=${{ steps.v.outputs.version }}
            REELSAW_COMMIT=${{ steps.v.outputs.commit }}
            REELSAW_BUILT_AT=${{ steps.v.outputs.built_at }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # a BuildKit secret: never in a layer, the cache or the build log
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # layer cache in GHCR, not the Actions cache: Actions caches are scoped to the ref, so a cache
          # written by one tag was never readable by the next (every release built from scratch and
          # spent ~7 min uploading a cache nothing used). The ci.yml stack job reads it too.
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd

      - name: No source in the image; bundle and ONNX models load on both architectures
        env:
          STAGING: ${{ env.GHCR_IMAGE }}:sha-${{ steps.v.outputs.commit }}
        run: |
          docker pull --platform linux/amd64 "$STAGING"
          sh scripts/check-image.sh "$STAGING"
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --entrypoint reelsaw "$STAGING" 2>&1 | grep -q "usage: reelsaw" || { echo "bundle failed to load on $arch"; exit 1; }
            # a real inference session: proves the native binary for this arch survived the trim
            docker run --rm --platform "linux/$arch" --entrypoint node -w /app/server "$STAGING" -e \
              'require("onnxruntime-node").InferenceSession.create(process.env.FACE_MODEL_PATH).then(s=>console.log("onnx ok",process.arch,s.inputNames.join(",")))' \
              | grep "onnx ok" || { echo "onnxruntime failed on $arch"; exit 1; }
          done

      # GitHub artifact attestation for the image digest: `gh attestation verify oci://ghcr.io/osbytes/reelsaw:<tag> --owner osbytes`
      # proves an image came from this workflow in this repository. The digest is the same under every tag below.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # only version tags publish; a manual run stops at the staging tag
      - name: Publish tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STAGING: ${{ env.GHCR_IMAGE }}:sha-${{ steps.v.outputs.commit }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$STAGING"

      # the Sentry release the maps were uploaded under gets its commits (suspect commits on new issues) and is finalized
      - name: Sentry release
        if: startsWith(github.ref, 'refs/tags/v') && env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        env:
          RELEASE: reelsaw@${{ steps.v.outputs.version }}
        run: |
          npx --yes @sentry/cli@2.39.1 releases new -p "$SENTRY_PROJECT" "$RELEASE"
          npx --yes @sentry/cli@2.39.1 releases set-commits "$RELEASE" --auto --ignore-missing || echo "commits not attached (is the GitHub integration installed in Sentry?)"
          npx --yes @sentry/cli@2.39.1 releases finalize "$RELEASE"

      - name: Install folder
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out/reelsaw
          cp deploy/docker-compose.yml deploy/docker-compose.gpu.yml deploy/.env.example deploy/README.md deploy/install.sh deploy/install.ps1 out/reelsaw/
          sed -i "s#ghcr.io/osbytes/reelsaw:latest#${GHCR_IMAGE}:${VERSION}#g" out/reelsaw/install.sh out/reelsaw/install.ps1
          # pin the default image to this release
          sed -i "s#\${REELSAW_IMAGE:-[^}]*}#\${REELSAW_IMAGE:-${GHCR_IMAGE}:${VERSION}}#" out/reelsaw/docker-compose.yml
          (cd out && zip -r "reelsaw-${VERSION}.zip" reelsaw)

      # provenance for the install folder, like the image: the attestation is stored on the repository,
      # and its Sigstore bundle is attached to the release next to the zip (`gh attestation verify
      # reelsaw-<v>.zip --owner osbytes` works online; the .intoto.jsonl is the offline copy)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: out/reelsaw-${{ steps.v.outputs.version }}.zip
      - name: Attestation bundle for the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd out
          gh attestation download "reelsaw-${VERSION}.zip" --repo "$GITHUB_REPOSITORY"
          mv sha256:*.jsonl "reelsaw-${VERSION}.zip.intoto.jsonl"
          ls -la

      # the release body is this version's CHANGELOG.md section (what changesets wrote), not the tag message
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > out/release-notes.md && cat out/release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: out/release-notes.md
          files: |
            out/reelsaw-${{ steps.v.outputs.version }}.zip
            out/reelsaw-${{ steps.v.outputs.version }}.zip.intoto.jsonl
          prerelease: ${{ contains(github.ref_name, '-') }}
