# Release flow (changesets): every merged PR carries a .changeset/*.md file. This workflow keeps a
# "Release vX.Y.Z" pull request open that bumps the version and writes CHANGELOG.md from them.
# Merging that PR runs `pnpm release:tag`, which pushes the vX.Y.Z tag; release.yml then builds
# and publishes the image and the install folder.
#
# Needs secrets.RELEASE_TOKEN: a fine-grained personal access token (or GitHub App token) with
# contents: write and pull-requests: write on this repo. Tags pushed with the default
# GITHUB_TOKEN never trigger other workflows, so release.yml would not run without it.
name: version

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release PR or tag
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
        with:
          title: "Release"
          commit: "Release"
          version: pnpm release:version
          publish: pnpm release:tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
