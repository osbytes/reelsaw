# Release flow (changesets): every merged PR carries a .changeset/*.md file. This workflow keeps a
# "Release vX.Y.Z" pull request open that bumps the version and writes CHANGELOG.md from them.
# Merging that PR runs `pnpm release:tag`, which pushes the vX.Y.Z tag; release.yml then builds
# and publishes the image and the install folder.
#
# Needs secrets.RELEASE_TOKEN: a fine-grained personal access token (or GitHub App token) with
# contents: write and pull-requests: write on this repo. Tags pushed with the default
# GITHUB_TOKEN never trigger other workflows, so release.yml would not run without it.
name: version

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the Release PR branch and the version tag (through RELEASE_TOKEN)
      pull-requests: write  # open and update the Release PR
    steps:
      # credentials stay in .git/config on purpose: changesets/action and release:tag push with them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release PR or tag
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 takes the token as an input and refuses a GITHUB_TOKEN env var that differs from it
          github-token: ${{ secrets.RELEASE_TOKEN }}
          pr-title: "Release"
          # the Release commit is created through the API as the token's owner; the trailer is what
          # the DCO check in contributors.yml requires of every non-bot commit
          commit-message: |
            Release

            Signed-off-by: dillonstreator <dillonstreator@gmail.com>
          version-script: pnpm release:version
          publish-script: pnpm release:tag
