# CI on every pull request and on main: typecheck, build the web bundle and the server bundle,
# run the tests that need no running stack, and make sure the PR carries a changeset. The tests
# that need the compose stack are stack.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a new push to a PR cancels its running checks; pushes to main each run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status compares against main
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: install.sh and install.ps1 write the same compose file
        run: |
          sh_yaml=$(sed -n "/^cat > docker-compose.yml <<'YAML'\$/,/^YAML\$/p" deploy/install.sh | sed '1d;$d')
          ps_yaml=$(sed -n "/^\\\$composeYaml = @'\$/,/^'@\$/p" deploy/install.ps1 | sed '1d;$d')
          [ -n "$sh_yaml" ] && [ "$sh_yaml" = "$ps_yaml" ] || { echo "compose templates differ"; diff <(echo "$sh_yaml") <(echo "$ps_yaml"); exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Biome lint (biome.json); warnings show as annotations, errors fail the job
      - run: pnpm exec biome ci
      # repo guards: no vendor-specific agent files (AGENTS.md only), the dup-of: ledger (a third use is due),
      # and the lint ratchet (counts of rules old code still breaks may only go down: scripts/lint-baseline.json)
      - run: pnpm guards
      # the English catalogue (apps/web/src/locales/en.po) matches the messages in the code (docs/I18N.md)
      - run: pnpm --filter @reelsaw/web i18n:check
      # .env.example, docs/CONFIG.md and the CLI/suite tables are generated from the code (pnpm docs:gen)
      - run: pnpm docs:check
      # packages/shared/src/whisper-languages.ts is Whisper's own table at a pinned commit (the script regenerates it)
      - run: pnpm languages:check
      - run: pnpm --filter @reelsaw/web build
      - run: pnpm --filter @reelsaw/server bundle
      # the Dockerfile's pinned, checksummed yt-dlp, so test/live-filter.test.ts runs the real --match-filter
      - name: Install yt-dlp (Dockerfile pin)
        run: |
          v=$(sed -n 's/^ARG YTDLP_VERSION=//p' Dockerfile); sum=$(sed -n 's/^ARG YTDLP_SHA256=//p' Dockerfile)
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/download/$v/yt-dlp" -o "$RUNNER_TEMP/yt-dlp"
          echo "$sum  $RUNNER_TEMP/yt-dlp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yt-dlp" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # every test file that does not import test/helpers.ts (no app, no Postgres); see docs/EVALS.md
      - run: pnpm --filter @reelsaw/server test:unit
        env:
          REQUIRE_YTDLP: "1"
      - run: node --test scripts/hook.test.mjs
      # the ONNX models behind the framing, pauses, alignment, speakers and overlays suites
      # (same script the Dockerfile runs); cached so CI does not download ~100 MB per run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/server/models
          key: onnx-models-${{ hashFiles('scripts/download-models.sh') }}
      - run: pnpm --filter @reelsaw/server models:download
      # ffmpeg + ffprobe for the media suites: one static BtbN build, pinned by release and sha256,
      # kept in the GitHub cache (apt-get install ffmpeg pulled hundreds of packages and took over
      # five minutes per run). To bump: pick a build from https://github.com/BtbN/FFmpeg-Builds/releases,
      # update the three values below and the cache key together.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1
      - name: Download ffmpeg (cache miss)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          FFMPEG_RELEASE: autobuild-2026-10-23-13-04
          FFMPEG_BUILD: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1
          FFMPEG_SHA256: d0eb612b8994407f78413e2929cb4b073bc699c8ab79e198b31624736fdc2f93
        run: |
          curl -fsSL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ~/ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ~/ffmpeg "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
          rm ffmpeg.tar.xz
      - run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH" && ~/ffmpeg/ffmpeg -version | head -1 && ~/ffmpeg/ffprobe -version | head -1
      # model-free eval suites against the committed baselines; suites whose media is not in git
      # skip themselves under --offline, and any regression fails the job
      - run: pnpm --filter @reelsaw/server eval:offline
      # a PR that changes the app must say what changed (pnpm changeset); docs-only PRs add an empty one
      - if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main
      # a changeset that names only an ignored package (web, shared) bumps nothing, yet makes
      # changesets/action open an empty Release PR on every push to main until it is retargeted
      - if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          bad=$(grep -l '"@reelsaw/' .changeset/*.md | xargs -r grep -L '"@reelsaw/server"' || true)
          [ -z "$bad" ] || { echo "changesets must name @reelsaw/server (web and shared are ignored): $bad"; exit 1; }

  # Every spoken language's captions through the binaries that ship: the image's own `system` stage (Debian's
  # ffmpeg and libass, the installed fonts) under its `dev` target, which adds the repo and its node_modules.
  # test/language-matrix.test.ts fails on a letter no installed font draws and on any libass "failed to find any
  # fallback with glyph"; the frame per language is kept as an artifact.
  language-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image's dev stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          load: true
          tags: reelsaw-matrix
          cache-from: type=gha,scope=language-matrix
          cache-to: type=gha,mode=max,scope=language-matrix
      - name: Render every language
        run: |
          mkdir -p frames && chmod 777 frames
          docker run --rm -e LANGUAGE_MATRIX_RENDER=1 -e LANGUAGE_MATRIX_FRAMES=/frames -v "$PWD/frames:/frames" \
            -w /app/apps/server reelsaw-matrix node --import tsx --test test/language-matrix.test.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: language-matrix-frames
          path: frames
          retention-days: 14

  # reelsaw.com (website/): its own pnpm root with its own lockfile, so it is checked on its own
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
