# CI on every pull request and on main: typecheck, build the web bundle and the server bundle,
# run the tests that need no running stack, and make sure the PR carries a changeset.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status compares against main
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: install.sh and install.ps1 write the same compose file
        run: |
          sh_yaml=$(sed -n "/^cat > docker-compose.yml <<'YAML'\$/,/^YAML\$/p" deploy/install.sh | sed '1d;$d')
          ps_yaml=$(sed -n "/^\\\$composeYaml = @'\$/,/^'@\$/p" deploy/install.ps1 | sed '1d;$d')
          [ -n "$sh_yaml" ] && [ "$sh_yaml" = "$ps_yaml" ] || { echo "compose templates differ"; diff <(echo "$sh_yaml") <(echo "$ps_yaml"); exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @reelsaw/web build
      - run: pnpm --filter @reelsaw/server bundle
      # every test file that does not import test/helpers.ts (no app, no Postgres); see docs/EVALS.md
      - run: pnpm --filter @reelsaw/server test:unit
      # the ONNX models behind the framing, pauses, alignment, speakers and overlays suites
      # (same script the Dockerfile runs); cached so CI does not download ~100 MB per run
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/server/models
          key: onnx-models-${{ hashFiles('scripts/download-models.sh') }}
      - run: pnpm --filter @reelsaw/server models:download
      # model-free eval suites against the committed baselines; suites whose media is not in git
      # skip themselves under --offline, and any regression fails the job
      - run: pnpm --filter @reelsaw/server eval:offline
      # a PR that changes the app must say what changed (pnpm changeset); docs-only PRs add an empty one
      - if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main

