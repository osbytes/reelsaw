# CI on every pull request and on main: typecheck, build the web bundle and the server bundle,
# run the tests that need no running stack, and make sure the PR carries a changeset.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status compares against main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: install.sh and install.ps1 write the same compose file
        run: |
          sh_yaml=$(sed -n "/^cat > docker-compose.yml <<'YAML'\$/,/^YAML\$/p" deploy/install.sh | sed '1d;$d')
          ps_yaml=$(sed -n "/^\\\$composeYaml = @'\$/,/^'@\$/p" deploy/install.ps1 | sed '1d;$d')
          [ -n "$sh_yaml" ] && [ "$sh_yaml" = "$ps_yaml" ] || { echo "compose templates differ"; diff <(echo "$sh_yaml") <(echo "$ps_yaml"); exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # .env.example, docs/CONFIG.md and the CLI/suite tables are generated from the code (pnpm docs:gen)
      - run: pnpm docs:check
      - run: pnpm --filter @reelsaw/web build
      - run: pnpm --filter @reelsaw/server bundle
      # every test file that does not import test/helpers.ts (no app, no Postgres); see docs/EVALS.md
      - run: pnpm --filter @reelsaw/server test:unit
      - run: node --test scripts/hook.test.mjs
      # the ONNX models behind the framing, pauses, alignment, speakers and overlays suites
      # (same script the Dockerfile runs); cached so CI does not download ~100 MB per run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/server/models
          key: onnx-models-${{ hashFiles('scripts/download-models.sh') }}
      - run: pnpm --filter @reelsaw/server models:download
      # ffmpeg + ffprobe for the media suites: one static BtbN build, pinned by release and sha256,
      # kept in the GitHub cache (apt-get install ffmpeg pulled hundreds of packages and took over
      # five minutes per run). To bump: pick a build from https://github.com/BtbN/FFmpeg-Builds/releases,
      # update the three values below and the cache key together.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1
      - name: Download ffmpeg (cache miss)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          FFMPEG_RELEASE: autobuild-2026-10-23-13-04
          FFMPEG_BUILD: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1
          FFMPEG_SHA256: d0eb612b8994407f78413e2929cb4b073bc699c8ab79e198b31624736fdc2f93
        run: |
          curl -fsSL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD.tar.xz"
          echo "$FFMPEG_SHA256  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ~/ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ~/ffmpeg "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
          rm ffmpeg.tar.xz
      - run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH" && ~/ffmpeg/ffmpeg -version | head -1 && ~/ffmpeg/ffprobe -version | head -1
      # model-free eval suites against the committed baselines; suites whose media is not in git
      # skip themselves under --offline, and any regression fails the job
      - run: pnpm --filter @reelsaw/server eval:offline
      # a PR that changes the app must say what changed (pnpm changeset); docs-only PRs add an empty one
      - if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since=origin/main
      # a changeset that names only an ignored package (web, shared) bumps nothing, yet makes
      # changesets/action open an empty Release PR on every push to main until it is retargeted
      - if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: |
          bad=$(grep -l '"@reelsaw/' .changeset/*.md | xargs grep -L '"@reelsaw/server"' || true)
          [ -z "$bad" ] || { echo "changesets must name @reelsaw/server (web and shared are ignored): $bad"; exit 1; }

  # reelsaw.com (website/): its own pnpm root with its own lockfile, so it is checked on its own
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Stack tests: the test files that import test/helpers.ts, against the real compose stack. The AI
  # provider is scripts/mock-ai.mjs on the runner (the app refuses to boot without a reachable
  # language and transcription model, by design). Separate job so the unit job stays fast; what it
  # covers and does not is in docs/EVALS.md ("Stack tests in CI").
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # helpers.ts runs `docker compose exec/cp` from the repo root: keep every call on the same files
      COMPOSE_FILE: docker-compose.yml:.github/compose.ci.yml
      REELSAW_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: mock AI provider (OpenAI-compatible, deterministic)
        run: |
          nohup node scripts/mock-ai.mjs > mock-ai.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:4545/v1/models >/dev/null && exit 0; sleep 1; done
          cat mock-ai.log; exit 1
      - name: throwaway .env (no real secrets)
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "APP_URL=http://localhost:3100"
            echo "PORT=3100"
            echo "OPENAI_BASE_URL=http://host.docker.internal:4545/v1"
            echo "OPENAI_API_KEY=mock"
            echo "AI_MODEL=openai:mock"
            echo "TRANSCRIPTION_MODEL=openai:whisper-1"
          } > .env
      - name: build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 900 app # Postgres is published on 127.0.0.1:5432
      - run: curl -fsS http://localhost:3100/api/health
      - run: pnpm --filter @reelsaw/server test
      - name: app logs
        if: failure()
        run: docker compose logs --no-color app > app.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stack-app-logs
          path: |
            app.log
            mock-ai.log
          if-no-files-found: ignore
