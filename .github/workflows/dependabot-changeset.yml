# Dependabot cannot write changesets, and CI requires one on every PR that changes the app
# (.changeset/README.md). This adds a patch changeset to a Dependabot PR that touches the app
# packages (the website and the workflow actions are not versioned, so their PRs get none).
#
# pull_request_target runs with repository secrets, so nothing from the PR may run here: the job
# never checks the PR out. It reads the PR's file list and writes the changeset through the GitHub
# contents API, as github-actions[bot] (which the DCO and CLA checks exempt), using RELEASE_TOKEN
# so CI runs on the new commit (commits made with GITHUB_TOKEN never trigger workflows). The only
# PR-controlled input is the title, which goes into the file body as data.
name: dependabot-changeset

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  changeset:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Add a changeset when the PR changes the app
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          changed=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" --jq '.[].filename')
          if ! grep -qE '^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|apps/|packages/|Dockerfile$)' <<<"$changed"; then
            echo "no app package changed; no changeset needed"; exit 0
          fi
          # only files this PR adds count: main holds the changesets waiting for the next release
          if grep -qE '^\.changeset/.+\.md$' <<<"$changed"; then
            echo "the PR already carries a changeset"; exit 0
          fi
          path=".changeset/dependabot-$NUMBER.md"
          # the title is data: written through printf into the file body, never evaluated
          content=$(printf -- '---\n"@reelsaw/server": patch\n---\n\nDependencies: %s.\n' "$TITLE" | base64 -w0)
          gh api --method PUT "repos/$REPO/contents/$path" \
            --field branch="$BRANCH" \
            --field message="Add a changeset for this dependency update" \
            --field content="$content" \
            --field 'committer[name]=github-actions[bot]' \
            --field 'committer[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            --field 'author[name]=github-actions[bot]' \
            --field 'author[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            --jq '.commit.sha'
