# Dependabot cannot write changesets, and CI requires one on every PR that changes the app
# (.changeset/README.md). This adds a patch changeset to a Dependabot PR that touches the app
# packages (the website and the workflow actions are not versioned, so their PRs get none).
#
# pull_request_target runs with repository secrets on a PR from the bot's branch. It is safe here
# because the job is restricted to dependabot[bot], runs only git commands (no install, no build,
# nothing from the PR executes) and writes one file whose content is the PR title. The push uses
# RELEASE_TOKEN rather than GITHUB_TOKEN so CI runs on the new commit (pushes made with
# GITHUB_TOKEN never trigger workflows).
name: dependabot-changeset

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  changeset:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Add a changeset when the PR changes the app
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! git diff --name-only "origin/main...HEAD" | grep -qE '^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|apps/|packages/|Dockerfile$)'; then
            echo "no app package changed; no changeset needed"; exit 0
          fi
          if ls .changeset/*.md 2>/dev/null | grep -v README.md | grep -q .; then
            echo "the PR already carries a changeset"; exit 0
          fi
          f=".changeset/dependabot-$NUMBER.md"
          # the title is data: written through printf, never evaluated
          printf -- '---\n"@reelsaw/server": patch\n---\n\nDependencies: %s.\n' "$TITLE" > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -s -m "Add a changeset for this dependency update"
          git push
