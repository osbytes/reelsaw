# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned actions, token
# permissions, branch protection, signed releases, dependency updates, …) once a week and on every
# push to main. Results go to the Security tab as code-scanning alerts and to scorecard.dev, which
# serves the README badge.
name: scorecard

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish_results signs the result with the workflow's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          sarif_file: results.sarif
