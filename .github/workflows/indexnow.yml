# Tell Bing, Yandex, Naver, Seznam and the other IndexNow engines which reelsaw.com pages changed.
# Runs on every push to main that touches website/, or by hand. A push first waits until Vercel's
# production deploy of that commit is live (/version.txt serves the commit, see
# website/app/version.txt/route.ts); Vercel does not report its deploys to GitHub, so a
# deployment_status trigger never fired. It then reads the live sitemap and submits every URL in it;
# IndexNow ignores URLs that did not change. The key is website/public/indexnow-key.txt: it is public
# by design (the engines fetch it from the site to verify the host), so it lives in the repo, not in
# a secret. Knowing it only lets someone submit URLs on this host.
name: indexnow

on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to submit, one per line (default: every URL in the live sitemap)"
        required: false
        type: string

permissions:
  contents: read

# a newer push supersedes a run still waiting for an older deploy
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://reelsaw.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: website/public/indexnow-key.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Wait for the production deploy of this commit
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          # Vercel builds main in a few minutes; give it 20
          for i in $(seq 1 40); do
            live=$(curl -fsSL --max-time 20 "$SITE_URL/version.txt?ts=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$live" = "$SHA" ]; then echo "Deploy of $SHA is live"; exit 0; fi
            if [ "$live" = "unknown" ]; then
              echo "::error::$SITE_URL/version.txt says unknown: expose Vercel's system environment variables (VERCEL_GIT_COMMIT_SHA) to the build"
              exit 1
            fi
            echo "Live: ${live:-nothing yet}; waiting for $SHA ($i/40)"
            sleep 30
          done
          echo "::error::$SITE_URL did not serve $SHA within 20 minutes (did the Vercel build fail or get skipped?)"
          exit 1

      - name: Check the key is live
        run: |
          key=$(tr -d '[:space:]' < website/public/indexnow-key.txt)
          [ -n "$key" ] || { echo "::error::website/public/indexnow-key.txt is empty"; exit 1; }
          echo "INDEXNOW_KEY=$key" >> "$GITHUB_ENV"
          key_url="$SITE_URL/indexnow-key.txt"
          # -L: the apex and www hosts redirect to whichever one is primary on Vercel; the engines follow too
          served=$(curl -fsSL --max-time 20 "$key_url" | tr -d '[:space:]' || true)
          if [ "$served" != "$key" ]; then
            echo "::error::$key_url does not serve the key in website/public/indexnow-key.txt (is the latest deploy live?)"
            exit 1
          fi

      - name: Collect URLs
        env:
          URLS: ${{ inputs.urls }}
        run: |
          if [ -n "$URLS" ]; then
            printf '%s\n' "$URLS" | sed '/^[[:space:]]*$/d' > urls.txt
          else
            curl -fsSL --max-time 20 "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' > urls.txt
          fi
          count=$(wc -l < urls.txt | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "::error::no URLs found"; exit 1; }
          echo "Submitting $count URL(s):"; cat urls.txt

      - name: Submit to IndexNow
        run: |
          host=$(printf '%s' "$SITE_URL" | sed -E 's#^https?://##; s#/.*$##')
          jq -n --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "$SITE_URL/indexnow-key.txt" \
            --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n") | map(select(length > 0)))}' > payload.json
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @payload.json)
          echo "IndexNow responded $status"; cat response.txt; echo
          # 200 = OK, 202 = accepted, key validation pending
          case "$status" in 200|202) ;; *) echo "::error::IndexNow rejected the submission ($status)"; exit 1 ;; esac
