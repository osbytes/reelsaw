# Publish this release to the official MCP registry (registry.modelcontextprotocol.io) as
# io.github.osbytes/reelsaw. release.yml calls it after the image is pushed and the GitHub release is
# created, so the image the server.json points at (ghcr.io/osbytes/reelsaw:<version>) already exists;
# the registry verifies it by the io.modelcontextprotocol.server.name label the Dockerfile sets.
# Not `on: release`: release.yml creates the release with GITHUB_TOKEN, and events from GITHUB_TOKEN
# never start other workflows. Run it by hand (workflow_dispatch) to backfill a version.
#
# Authentication is GitHub OIDC (no secret): the registry grants the io.github.<owner> namespace to
# workflows of that owner's repositories. release.yml skips pre-releases.
name: publish-mcp

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (an existing image tag, e.g. 0.18.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (an existing image tag, e.g. 0.18.1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to the registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          # versions only: nothing else ever reaches the JSON
          case "$v" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version: $v"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set the version and image tag in server.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].identifier = ("ghcr.io/osbytes/reelsaw:" + $v)' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: The image exists and carries the registry label
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker buildx imagetools inspect "ghcr.io/osbytes/reelsaw:$VERSION" --format '{{json .Image}}' \
            | jq -e '[.. | objects | select(has("config")) | .config.Labels["io.modelcontextprotocol.server.name"]?] | any(. == "io.github.osbytes/reelsaw")' >/dev/null \
            || { echo "ghcr.io/osbytes/reelsaw:$VERSION has no io.modelcontextprotocol.server.name label"; exit 1; }

      # pinned by release and sha256 (this job holds an OIDC token the registry trusts). To bump: pick
      # a release from https://github.com/modelcontextprotocol/registry/releases and take the
      # mcp-publisher_linux_amd64.tar.gz line of its registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help | head -1

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
