# zizmor (lint for workflows and dependabot.yml, run by security.yml and the pre-push hook). Each exception says why.
rules:
  artipacked:
    ignore:
      # changesets/action and `pnpm release:tag` push with the credentials checkout leaves in .git/config
      - version.yml
  superfluous-actions:
    # softprops/action-gh-release is pinned and does what `gh release` would; not a security finding
    disable: true
  cache-poisoning:
    ignore:
      # the stack job's build-push-action only loads the image into the runner's Docker (load: true)
      # to test it; nothing is pushed, so a poisoned pnpm or layer cache cannot reach a release
      - ci.yml
  dangerous-triggers:
    ignore:
      # workflow_run (after release) only pulls the public :latest image for Grype and uploads the
      # SARIF; it never checks out code or reads anything from the triggering run
      - security.yml
