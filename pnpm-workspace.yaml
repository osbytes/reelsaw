packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  protobufjs: true
  onnxruntime-node: true
  # postinstall runs `lefthook install` (git hooks, lefthook.yml); it does nothing when CI is set
  lefthook: true
  # pulled in by posthog-js; its postinstall only prints a funding notice
  core-js: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.113'
  - '@ai-sdk/google@4.0.95'
  - '@ai-sdk/openai@4.0.93'
  - ai@7.0.140
  - lucide-react@1.57.0
  - pg-boss@12.38.0

overrides:
  # GHSA-67mh-4wv8-2f99: the deprecated esbuild-kit (pulled in by drizzle-kit) pins a vulnerable esbuild
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # better-auth 1.7.12 pins better-call 1.4.2 while @better-auth/core 1.7.12 wants 1.4.4; one version
  # keeps a single core instance (two break the plugin types in auth.ts)
  better-call: 1.4.4
